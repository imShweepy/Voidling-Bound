const SPECIES=Object.keys(DATA);
let current=SPECIES[0], filter="All";
const $=id=>document.getElementById(id);
const select=$("voidling"), search=$("search"), searchBtn=$("searchBtn");
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(x){return String(x||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function dist(a,b){
 const d=Array.from({length:b.length+1},(_,i)=>i);
 for(let i=1;i<=a.length;i++){
   let prev=d[0]; d[0]=i;
   for(let j=1;j<=b.length;j++){
     const cur=d[j];
     d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));
     prev=cur;
   }
 }
 return d[b.length];
}
function ranked(q){
 const n=norm(q);
 return SPECIES.map(name=>{
   const x=norm(name); let score=-dist(n,x);
   if(x===n)score+=1000;
   if(x.startsWith(n))score+=300;
   if(x.includes(n))score+=100;
   return {name,score};
 }).sort((a,b)=>b.score-a.score).map(x=>x.name);
}
function switchVoidling(name){
 if(!DATA[name])return;
 current=name; filter="All"; select.value=name; search.value="";
 $("searchResults").innerHTML="";
 render();
 window.scrollTo({top:0,behavior:"smooth"});
}
function render(){
 $("heading").textContent=current;
 $("sub").textContent="Evolution tree and ability preview for "+current;
 $("quick").innerHTML=SPECIES.map(s=>`<button class="${s===current?"on":""}" data-v="${esc(s)}">${esc(s)}</button>`).join("");
 $("quick").querySelectorAll("button").forEach(b=>b.onclick=()=>switchVoidling(b.dataset.v));
 $("tabs").innerHTML=["All","Rare","Superior","Exotic","Mutated","Special"].map(t=>`<button class="${t===filter?"on":""}" data-t="${t}">${t}</button>`).join("");
 $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.t;render()});

 const d=DATA[current]||{}, rows=[];
 const add=(key,label)=>{if(filter==="All"||filter===label)(d[key]||[]).forEach(n=>rows.push([label,n]))};
 add("rare","Rare"); add("superior","Superior"); add("exotic","Exotic"); add("mutated","Mutated");
 if(filter==="All"||filter==="Special") (d.unique||[]).forEach(n=>rows.push(["Special",n]));

 if(!rows.length){$("list").innerHTML='<div class="sub">No entries for this filter.</div>';return}
 $("list").innerHTML=rows.map(([tier,name])=>{
   let text=DESC[name]||PERK_DESC[name]||"";
   return `<div class="item"><div class="tier">${esc(tier)}</div><div class="name">${esc(name)}</div>${text?`<div class="ability">${esc(text)}</div>`:""}</div>`;
 }).join("");
}
select.innerHTML='<option value="">Choose a Voidling…</option>'+SPECIES.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("");
select.onchange=()=>selectVoidling(select.value);
function doSearch(){const q=search.value.trim();if(q){const r=ranked(q);if(r.length) switchVoidling(r[0])}}
searchBtn.onclick=doSearch;
search.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();doSearch()}};
search.oninput=()=>{
 const q=search.value.trim(), box=$("searchResults");
 if(!q){box.innerHTML="";return}
 box.innerHTML=ranked(q).slice(0,5).map(n=>`<button data-v="${esc(n)}">${esc(n)}</button>`).join("");
 box.querySelectorAll("button").forEach(b=>b.onclick=()=>switchVoidling(b.dataset.v));
};
